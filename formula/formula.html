<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="formula.css"
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Формула 1</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
    <img src="f1.png" alt="Formula 1 Logo">

      <div class="header-title">
        <h1>ФОРМУЛА 1 СИМУЛАТОР</h1>
        <p>Брзина. Стратегија. Победа</p>
      </div>
   </header>


    <main>

        <!-- Информации за трката -->
        <section id="race-info">
            <h2>Трка</h2>

            <p>
                Круг:
                <span id="current-lap">0</span>
                / 10
            </p>

            <button id="start-race">Започни трка</button>
            <button id="reset-race">Нова трка</button>

        </section>


        <!-- Табела со возачи -->
        <section id="drivers-section">

            <h2>Возачи</h2>

            <table id="drivers-table">

                <thead>
                    <tr>
                        <th>Позиција</th>
                        <th>Возач</th>
                        <th>Тим</th>
                        <th>Базична брзина</th>
                        <th>Базична вештина</th>
                        <th>Гуми</th>
                        <th>Време</th>
                        <th>Статус</th>
                    </tr>
                </thead>

                <tbody id="drivers-body">
                    <!-- Возачите ќе се додадат преку JavaScript -->
                </tbody>

            </table>

        </section>


        <!-- Статус на тековниот круг -->
        <section id="lap-status">

            <h2>Статус на кругот</h2>

            <table id="status-table">

                <thead>
                    <tr>
                        <th>Возач</th>
                        <th>Круг</th>
                        <th>Настан</th>
                    </tr>
                </thead>

                <tbody id="status-body">
                    <!-- Статусите ќе се додаваат преку JavaScript -->
                </tbody>

            </table>

        </section>
 

        <!-- Резултати -->
        <section id="results">

    <h2>Конечни резултати</h2>

    <div id="winner">
        Победник: <span id="winner-name">-</span>
    </div>

    <table id="results-table">

            <thead>
              <tr>
                <th>Позиција</th>
                <th>Возач</th>
                <th>Тим</th>
                <th>Вкупно време</th>
                <th>Статус</th>
              </tr>
            </thead>

           <tbody id="results-body"></tbody>

         </table>

        </section>

    </main>


    <footer>
        <p>Формула 1 - Домашна задача #3</p>
    </footer>


    <script src="formula.js"></script>

</body>
</html>
